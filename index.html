<!DOCTYPE html>
<html lang="uk">

</head>

        <div class="slot-machine">

            </div>
            <div class="column" id="col-1">
                <div class="slot-cell"></div>
                <div class="slot-cell"></div>
                <div class="slot-cell"></div>
            </div>
            <div class="column" id="col-2">
                <div class="slot-cell"></div>
                <div class="slot-cell"></div>
                <div class="slot-cell"></div>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
